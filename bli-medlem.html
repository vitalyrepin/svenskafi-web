<div class=memberpage><p class=mtitle style=font-size:29px>Bli medlem</p><p class=mline>Som vår medlem får du delta i all verksamhet som ordnas av Svenska.fi rf, påverka föreningens arbete och delta i kurser och evenemang med förmånlig pris.</p><p class=mline>Anslutningsavgift är 10€</p></div><form class=member id=memberform><label>Namn *<input type=text name="Namn" required></label><label>E-post *<input type=email name="E-post" required></label><label>Din adress *<input type=text name="Din adress" required></label><label>Dina kunskaper i svenska *<select name=skills><option>No skills yet</option><option>Beginner (A1-A2)</option><option>Intermediate (B1-B2)</option><option>Advanced (C1-C2)</option><option>Native speaker</option></select></label><button type=submit>Ansök om medlemskap</button></form>
<script>
document.getElementById("memberform").addEventListener("submit", function(ev) {
  ev.preventDefault();
  var f = ev.target;
  var body = "";
  for (var i = 0; i < f.elements.length; i++) { var el = f.elements[i]; if (el.value) { body += el.name + ": " + el.value + "\n"; } }
  window.location.href = "mailto:info@svenska.fi?subject=" + encodeURIComponent("Membership application") + "&body=" + encodeURIComponent(body);
});
